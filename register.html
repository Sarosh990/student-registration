<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Registration Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 class="heading">Student Registration Website</h1>

    <div class="form-box">
        <form action="thanks.html" method="GET">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" value="Sarosh Ahmad" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="saroshahmad510@gmail.cc" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value="1234567" required>
            </div>

            <div class="form-group radio-group">
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="Male" checked>
                <label for="male" class="inline-label">Male</label>
                
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" class="inline-label">Female</label>
            </div>

            <div class="form-group">
                <label for="department">Department:</label>
                <select id="department" name="department">
                    <option value="IT" selected>IT</option>
                    <option value="CS">CS</option>
                    <option value="EE">Electrical Engineering</option>
                    <option value="SE">Software Engineering</option>
                </select>
            </div>

            <button type="submit" class="btn-register">Register</button>
        </form>
    </div>

</body>
</html>
